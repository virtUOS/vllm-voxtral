name: Auto Update vLLM Image

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 6am UTC
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Normalize image name
        id: meta
        run: echo "image_name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Get latest vLLM release
        id: vllm
        run: |
          VERSION=$(curl -s https://api.github.com/repos/vllm-project/vllm/releases/latest \
            | jq -r '.tag_name')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Latest vLLM version: ${VERSION}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image tag already exists
        id: check
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.vllm.outputs.version }}"
          if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image already exists, skipping build"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "New version detected, starting build"
          fi

      - name: Build and push
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.vllm.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:latest
          build-args: |
            VLLM_VERSION=${{ steps.vllm.outputs.version }}
